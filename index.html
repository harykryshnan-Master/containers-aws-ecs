<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Deployment to Amazon ECS</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #2ecc71;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70px;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .navbar button {
      background-color: transparent;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin: 0 10px;
      padding: 15px 20px;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .navbar button:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .content {
      padding-top: 90px;
      text-align: center;
    }

    h1 {
      color: #2ecc71;
      font-size: 36px;
      margin-bottom: 20px;
    }

    p {
      color: #555;
      font-size: 18px;
      line-height: 1.6;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .animated {
      animation-duration: 1s;
      animation-fill-mode: both;
      animation-name: fadeIn;
    }
  </style>
</head>
<body>

<div class="navbar">
  <button>Home</button>
  <button>Services</button>
  <button>About Us</button>
  <button>DevOps Courses</button>
</div>

<div class="content">
  <h1 class="animated">WEB APPLICATION DEPLOYMENT TO ECS</h1>
  <p class="animated">Feels good learning Containerization with Docker and Deployment to Amazon ECS</p>
</div>

</body>
</html>
